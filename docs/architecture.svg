<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" width="980" height="600" font-family="Segoe UI, system-ui, -apple-system, Roboto, sans-serif">
  <title>Zien Call architecture</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b7dff"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#22c55e"/></marker>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b93a1"/></marker>
    <style>
      .t{fill:#e8ebf0;font-size:14px;font-weight:600}
      .s{fill:#8b93a1;font-size:12px}
      .l{fill:#c4c9d4;font-size:11.5px}
      .box{fill:#161a21;stroke:#2a303b;stroke-width:1.5}
      .hi{fill:#1d222b;stroke:#8b7dff;stroke-width:1.5}
      .ln{stroke:#8b7dff;stroke-width:2;fill:none}
      .md{stroke:#22c55e;stroke-width:2;fill:none;stroke-dasharray:6 4}
      .mu{stroke:#8b93a1;stroke-width:1.5;fill:none;stroke-dasharray:3 4}
    </style>
  </defs>

  <rect width="980" height="600" rx="16" fill="#0f1115"/>
  <text x="24" y="38" fill="#e8ebf0" font-size="20" font-weight="700">Zien Call · architecture</text>
  <text x="24" y="58" class="s">Everything runs on one Oracle Always Free VM · $0/month</text>

  <!-- members -->
  <rect class="box" x="24" y="150" width="170" height="250" rx="12"/>
  <text x="40" y="176" class="t">Members (≤ 10)</text>
  <rect class="hi" x="40" y="192" width="138" height="78" rx="10"/>
  <text x="54" y="216" class="t" font-size="13">Web browser</text>
  <text x="54" y="236" class="s">desktop &amp; mobile</text>
  <text x="54" y="254" class="s">installable PWA</text>
  <rect class="hi" x="40" y="284" width="138" height="78" rx="10"/>
  <text x="54" y="308" class="t" font-size="13">Android app</text>
  <text x="54" y="328" class="s">Capacitor wrapper</text>
  <text x="54" y="346" class="s">camera + mic</text>
  <text x="40" y="388" class="s">Russia ↔ India friendly</text>

  <!-- cloudflare -->
  <rect class="box" x="250" y="78" width="230" height="58" rx="10"/>
  <text x="264" y="101" class="t" font-size="13">Cloudflare DNS (DNS only)</text>
  <text x="264" y="121" class="s">call · rtc · turn → VM public IP</text>

  <!-- resend -->
  <rect class="box" x="720" y="78" width="236" height="58" rx="10"/>
  <text x="734" y="101" class="t" font-size="13">Resend (free tier)</text>
  <text x="734" y="121" class="s">sign-up &amp; reset codes by email</text>

  <!-- VM -->
  <rect x="236" y="160" width="720" height="420" rx="14" fill="none" stroke="#C74634" stroke-width="2" stroke-dasharray="8 5"/>
  <rect x="252" y="150" width="440" height="22" rx="6" fill="#0f1115"/>
  <text x="258" y="166" fill="#f0907f" font-size="13" font-weight="700">Oracle Cloud · VM.Standard.E2.1.Micro · 1 GB RAM · Mumbai · Docker</text>

  <!-- caddy -->
  <rect class="box" x="260" y="196" width="170" height="200" rx="12"/>
  <text x="276" y="222" class="t">Caddy (layer 4)</text>
  <text x="276" y="244" class="l">:443 · Let's Encrypt TLS</text>
  <text x="276" y="263" class="l">routes by hostname (SNI)</text>
  <text x="276" y="290" class="s">call.* → web app</text>
  <text x="276" y="309" class="s">  + real client IP</text>
  <text x="276" y="328" class="s">  (PROXY protocol)</text>
  <text x="276" y="352" class="s">rtc.* → LiveKit</text>
  <text x="276" y="371" class="s">turn.* → TURN/TLS</text>

  <!-- web app -->
  <rect class="hi" x="490" y="196" width="230" height="190" rx="12"/>
  <text x="506" y="222" class="t">Web app · Node 22 + Express</text>
  <text x="506" y="242" class="s">127.0.0.1:3000</text>
  <text x="506" y="266" class="l">• Accounts, email verification</text>
  <text x="506" y="285" class="l">• Chat channels + DMs (live SSE)</text>
  <text x="506" y="304" class="l">• Call tokens (2-hour JWT)</text>
  <text x="506" y="323" class="l">• Admin: members (≤ 10), roles</text>
  <text x="506" y="342" class="l">• Monitoring + ping endpoint</text>
  <text x="506" y="368" class="s">SQLite · /data/zien.db</text>

  <!-- livekit -->
  <rect class="hi" x="490" y="420" width="230" height="140" rx="12"/>
  <text x="506" y="446" class="t">LiveKit SFU</text>
  <text x="506" y="466" class="s">audio/video rooms, ≤ 10 people</text>
  <text x="506" y="490" class="l">signalling :7880 (via rtc.*)</text>
  <text x="506" y="509" class="l">TURN/TLS :5349 · TURN UDP 3478</text>
  <text x="506" y="528" class="l">media UDP 50000–60000 · TCP 7881</text>

  <!-- monitoring sources -->
  <rect class="box" x="760" y="196" width="176" height="150" rx="12"/>
  <text x="776" y="222" class="t" font-size="13">Monitoring sources</text>
  <text x="776" y="246" class="l">/proc (CPU, RAM, swap,</text>
  <text x="776" y="263" class="l">disk, network, steal)</text>
  <text x="776" y="287" class="l">cgroups (per container)</text>
  <text x="776" y="311" class="l">OCI metadata (shape,</text>
  <text x="776" y="328" class="l">region, Always Free)</text>

  <!-- arrows -->
  <path class="ln" d="M194 250 H258" marker-end="url(#a)"/>
  <text x="199" y="242" class="s">HTTPS</text>
  <text x="199" y="266" class="s">:443</text>
  <path class="mu" d="M365 136 V194" marker-end="url(#m)"/>
  <path class="ln" d="M430 270 H488" marker-end="url(#a)"/>
  <path class="ln" d="M430 360 C460 360 460 470 488 470" marker-end="url(#a)"/>
  <path class="ln" d="M605 386 V418" marker-end="url(#a)"/>
  <text x="612" y="407" class="s">room API</text>
  <path class="ln" d="M720 230 C740 230 740 120 718 110" marker-end="url(#a)"/>
  <path class="mu" d="M758 270 H722" marker-end="url(#m)"/>
  <path class="md" d="M110 400 V545 H488" marker-end="url(#g)"/>
  <text x="250" y="566" fill="#22c55e" font-size="12">WebRTC media · UDP, TURN/443 fallback</text>
</svg>
